<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIESVERSE | Verify</title>
  <script src="tv-config.js"></script>
  <style>
    :root { --bg:#0a0a0a; --card:#111; --border:#222; --text:#fff; --muted:#9a9a9a; --accent:#fe7a00; --good:#25D366; --bad:#ff4444; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(520px 900px at -12% 55%, rgba(254, 122, 0, 0.14), transparent 62%),
        radial-gradient(520px 900px at 112% 45%, rgba(254, 122, 0, 0.10), transparent 62%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .brand { font-weight: 900; letter-spacing: 0.02em; }
    .brand span { color: var(--accent); }
    .card {
      margin-top: 16px;
      background: rgba(17,17,17,0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    }
    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      letter-spacing: 0.08em;
      font-size: 12px;
    }
    .ok { color: var(--good); border-color: rgba(37,211,102,0.35); background: rgba(37,211,102,0.07); }
    .no { color: var(--bad); border-color: rgba(255,68,68,0.35); background: rgba(255,68,68,0.07); }
    .title { margin-top: 10px; font-size: 22px; font-weight: 1000; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .grid { margin-top: 14px; display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: rgba(0,0,0,0.12); }
    .k { color: var(--muted); font-size: 12px; }
    .v { font-size: 14px; word-break: break-word; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: 0.14em; }
    a { color: var(--accent); }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">.<span>ties</span>verse Verification</div>
    <div class="card" id="card">
      <div class="badge" id="badge">LOADING</div>
      <div class="title" id="title">Checking certificateâ€¦</div>
      <div class="sub" id="sub">
        This page verifies a certificate/offer letter by matching its ID against the issuing database.
      </div>
      <div class="grid" id="grid" style="display:none;"></div>
    </div>
    <div class="sub" style="margin-top:12px;">
      If you believe this is an error, contact <a href="mailto:hello@tiesverse.com">hello@tiesverse.com</a>.
    </div>
  </div>

  <script>
    function getParam(name) {
      const u = new URL(window.location.href);
      return String(u.searchParams.get(name) || "").trim();
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#039;");
    }

    function jsonp(url, params, timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const cb = `__tv_verify_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const query = new URLSearchParams({ ...(params || {}), callback: cb }).toString();
        const src = `${url}${url.includes("?") ? "&" : "?"}${query}`;

        const script = document.createElement("script");
        let done = false;

        function cleanup() {
          if (done) return;
          done = true;
          try { delete window[cb]; } catch (_) {}
          try { script.remove(); } catch (_) {}
        }

        const t = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, timeoutMs);

        window[cb] = (data) => { clearTimeout(t); cleanup(); resolve(data); };
        script.onerror = () => { clearTimeout(t); cleanup(); reject(new Error("JSONP load failed")); };
        script.src = src;
        document.head.appendChild(script);
      });
    }

    async function run() {
      const id = getParam("id").toUpperCase();
      const badge = document.getElementById("badge");
      const title = document.getElementById("title");
      const grid = document.getElementById("grid");

      if (!id) {
        badge.className = "badge no";
        badge.textContent = "MISSING ID";
        title.textContent = "No certificate ID provided";
        return;
      }

      const url = window.TV_APP_SCRIPT_URL;
      if (!url) {
        badge.className = "badge no";
        badge.textContent = "CONFIG ERROR";
        title.textContent = "Verification service not configured";
        return;
      }

      try {
        const res = await jsonp(url, { action: "VERIFY_CERT_JSON", code: id });
        if (!res || res.status !== "success") throw new Error("Bad response");

        if (!res.ok) {
          badge.className = "badge no";
          badge.textContent = "NOT FOUND";
          title.textContent = "Certificate not found";
          grid.style.display = "grid";
          grid.innerHTML = `<div class="row"><div class="k">Certificate ID</div><div class="v mono">${escapeHtml(id)}</div></div>`;
          return;
        }

        const r = res.record || {};
        badge.className = "badge ok";
        badge.textContent = "VERIFIED";
        title.textContent = "This document is authentic";

        grid.style.display = "grid";
        grid.innerHTML = `
          <div class="row"><div class="k">Certificate ID</div><div class="v mono">${escapeHtml(r.certificate_code || id)}</div></div>
          <div class="row"><div class="k">Employee Name</div><div class="v">${escapeHtml(r.employee_name || "")}</div></div>
          <div class="row"><div class="k">Role</div><div class="v">${escapeHtml(r.offer_role || "")}</div></div>
          <div class="row"><div class="k">Manager Name</div><div class="v">${escapeHtml(r.manager_name || "")}</div></div>
          <div class="row"><div class="k">Joining Date</div><div class="v">${escapeHtml(r.joining_date || "")}</div></div>
          <div class="row"><div class="k">Issue Date</div><div class="v">${escapeHtml(r.issue_date || "")}</div></div>
        `;
      } catch (e) {
        badge.className = "badge no";
        badge.textContent = "ERROR";
        title.textContent = "Verification failed";
      }
    }

    run();
  </script>
</body>
</html>
