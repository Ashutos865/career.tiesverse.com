<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apply · Tiesverse Internships</title>
  <script src="tv-config.js?v=2"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap");

    :root{
      --orange:#FE7A00; --orange-d:#e56d00; --orange-ink:#9a4b00;
      --ink:#1d160d; --muted:#6f6656; --faint:rgba(29,22,13,.48);
      --rule:#eadfce; --hair:rgba(29,22,13,.08);
      --paper:#fdf9f2; --card:#ffffff; --field:#fbf8f3;
      --radius:16px; --shadow:0 22px 55px rgba(70,40,0,.09);
      --serif:"Fraunces",Georgia,serif;
      --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{
      margin:0;color:var(--ink);font-family:var(--sans);line-height:1.55;letter-spacing:-.01em;
      background:
        radial-gradient(680px 460px at 12% -10%, rgba(254,122,0,.10), transparent 66%),
        radial-gradient(720px 520px at 100% 6%, rgba(255,209,148,.16), transparent 68%),
        linear-gradient(180deg,#fdf9f2 0%,#fff7eb 52%,#fdf9f2 100%);
      background-attachment:fixed;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:620px;margin:0 auto;padding:44px 20px 84px}

    /* header */
    .brand{display:inline-flex;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.04em;color:var(--ink)}
    .brand .dot,.brand .verse{color:var(--orange)}
    h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5.6vw,46px);letter-spacing:-.02em;line-height:1.03;margin:20px 0 10px;text-wrap:balance}
    .lede{color:var(--muted);font-size:16px;line-height:1.6;margin:0;max-width:52ch}
    .meta{font-size:13px;color:var(--faint);margin:16px 0 26px}
    .meta .req{color:var(--orange)}

    /* card + sections (single card, hairline-divided - no nested boxes) */
    .card{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 24px}
    .sec{padding:22px 0}
    .divider{height:1px;background:var(--hair)}
    .sec-eyebrow{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:16px}
    .sec-eyebrow em{font-style:normal;color:var(--faint);font-weight:600;letter-spacing:.01em;text-transform:none;font-size:12px;margin-left:7px}

    /* fields */
    .field{margin-bottom:13px}
    .field:last-child{margin-bottom:0}
    label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
    .req{color:var(--orange)}
    .hint{font-weight:400;color:var(--faint)}
    input,textarea{
      width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:9px;
      font:inherit;font-size:14px;background:var(--field);color:var(--ink);
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    input:hover,textarea:hover{border-color:#d9cbb4}
    input:focus,textarea:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(254,122,0,.14)}
    input::placeholder,textarea::placeholder{color:var(--faint)}
    textarea{resize:vertical;min-height:72px;line-height:1.5}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px}
    .grid2 .field{margin-bottom:0}
    @media(max-width:520px){.grid2{grid-template-columns:1fr;gap:0}.grid2 .field{margin-bottom:13px}}

    /* custom dropdown */
    .tvselect{position:relative}
    .tvselect-btn{
      width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:9px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--field);
      color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    .tvselect-btn:hover{border-color:#d9cbb4}
    .tvselect.open .tvselect-btn,.tvselect-btn:focus-visible{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(254,122,0,.14)}
    .tvselect-value.placeholder{color:var(--faint)}
    .tvselect-chev{flex:none;display:grid;color:var(--muted);transition:transform .22s ease}
    .tvselect.open .tvselect-chev{transform:rotate(180deg)}
    .tvselect-panel{
      position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;
      background:#fff;border:1px solid var(--rule);border-radius:12px;
      box-shadow:0 20px 46px rgba(70,40,0,.16);padding:6px;max-height:296px;overflow:auto;
      display:none;animation:selIn .16s ease;
    }
    .tvselect.open .tvselect-panel{display:block}
    @keyframes selIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
    .tvselect-opt{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px 12px;border-radius:8px;cursor:pointer;
    }
    .tvselect-opt .opt-main{display:flex;flex-direction:column;gap:2px;min-width:0}
    .tvselect-opt .opt-label{font-size:14.5px;font-weight:500}
    .tvselect-opt .opt-sub{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .tvselect-opt .opt-check{flex:none;color:var(--orange);font-weight:800;opacity:0;transition:opacity .12s}
    .tvselect-opt.active{background:rgba(254,122,0,.10)}
    .tvselect-opt.selected .opt-label{color:var(--orange-ink);font-weight:700}
    .tvselect-opt.selected .opt-check{opacity:1}
    .tvselect-empty{padding:12px;color:var(--faint);font-size:14px;text-align:center}

    #roleQuestions{margin-top:16px}
    .role-empty{color:var(--faint);font-size:14px;padding:16px;border:1px dashed var(--rule);border-radius:10px;text-align:center;background:rgba(255,255,255,.4)}

    /* file upload */
    .file{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
    .file-btn{
      display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid var(--rule);
      border-radius:9px;background:var(--field);font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
      cursor:pointer;transition:border-color .16s,background .16s,color .16s;
    }
    .file-btn:hover{border-color:var(--orange);background:rgba(254,122,0,.07);color:var(--orange-ink)}
    .file-btn svg{width:16px;height:16px}
    .file-name{font-size:13px;color:var(--faint)}
    .file-name.has{color:var(--ink);font-weight:600}

    /* acknowledgement */
    .ack{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5;margin:22px 2px 0;cursor:pointer}
    .ack input{position:absolute;opacity:0;width:0;height:0}
    .ack .box{flex:none;width:20px;height:20px;border:1.6px solid var(--rule);border-radius:6px;background:var(--field);display:grid;place-items:center;margin-top:1px;transition:background .16s,border-color .16s,box-shadow .16s}
    .ack .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:opacity .12s}
    .ack input:checked + .box{background:var(--orange);border-color:var(--orange)}
    .ack input:checked + .box svg{opacity:1}
    .ack input:focus-visible + .box{box-shadow:0 0 0 3px rgba(254,122,0,.22)}

    /* submit + messages */
    .submit{
      width:100%;margin-top:22px;padding:15px;border:none;border-radius:12px;background:var(--orange);
      color:#fff;font:inherit;font-size:16px;font-weight:800;letter-spacing:.01em;cursor:pointer;
      box-shadow:0 12px 26px rgba(254,122,0,.24);transition:background .2s,transform .1s,box-shadow .2s;
    }
    .submit:hover{background:var(--orange-d);transform:translateY(-1px)}
    .submit:active{transform:translateY(0)}
    .submit:disabled{opacity:.6;cursor:wait;transform:none}
    .msg{padding:13px 15px;border-radius:11px;font-size:14px;font-weight:600;margin-bottom:16px;display:none}
    .msg.err{background:#fdecec;color:#a7141f;border:1px solid #f5c2c2;display:block}
    .msg.ok{background:#e8faf2;color:#065f46;border:1px solid #a7e8cd;display:block}

    /* success */
    .done{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:50px 28px;text-align:center}
    /* A PNG, not the 🎉 character: every device then shows the Apple artwork
       rather than its own — Android and Windows draw quite different poppers. */
    .done .tick{width:66px;height:66px;display:block;margin:0 auto 20px}
    .done h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 10px}
    .done p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 auto;max-width:44ch}
    .done strong{color:var(--ink)}

    @media(max-width:520px){
      .wrap{padding:28px 14px 64px}
      .card{padding:0 16px;border-radius:14px}
      .sec{padding:20px 0}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <span class="brand"><span class="dot">.</span>ties<span class="verse">verse</span></span>
    <h1>Apply for an internship</h1>
    <p class="lede">One short form. Pick your role, answer a few quick questions, and you're in.</p>
    <p class="meta">Fields marked <span class="req">*</span> are required.</p>

    <div id="formHost">
      <div id="msg" class="msg"></div>
      <form id="applyForm" novalidate>
        <div class="card">
          <!-- Your details -->
          <section class="sec">
            <span class="sec-eyebrow">Your details</span>
            <div class="grid2">
              <div class="field"><label>First name <span class="req">*</span></label><input name="first_name" required /></div>
              <div class="field"><label>Last name <span class="req">*</span></label><input name="last_name" required /></div>
            </div>
            <div class="grid2">
              <div class="field"><label>Email <span class="req">*</span></label><input name="email" type="email" required /></div>
              <div class="field"><label>WhatsApp number <span class="req">*</span></label><input name="phone" required placeholder="+91…" /></div>
            </div>
            <div class="grid2">
              <div class="field"><label>LinkedIn profile URL <span class="req">*</span></label><input name="linkedin" required placeholder="https://linkedin.com/in/…" /></div>
              <div class="field"><label>Current city <span class="req">*</span></label><input name="city" required /></div>
            </div>
            <div class="field"><label>Portfolio / GitHub / Behance <span class="hint">(if any)</span></label><input name="portfolio" placeholder="https://…" /></div>
            <div class="field"><label>Why do you want to join us? <span class="req">*</span></label><textarea name="why_join" required placeholder="A few sentences."></textarea></div>
          </section>

          <div class="divider"></div>

          <!-- Role -->
          <section class="sec">
            <span class="sec-eyebrow">Role</span>
            <div class="field">
              <label>Which role are you applying for? <span class="req">*</span></label>
              <div id="roleMount"></div>
            </div>
            <div id="roleQuestions"><div class="role-empty">Pick a role above to see its questions.</div></div>
          </section>

          <div class="divider"></div>

          <!-- Resume -->
          <section class="sec">
            <span class="sec-eyebrow">Resume <em>optional · PDF</em></span>
            <input id="resumeInput" type="file" accept="application/pdf,.pdf" hidden />
            <div class="file">
              <button type="button" class="file-btn" id="fileBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Choose PDF file
              </button>
              <span class="file-name" id="fileName">No file chosen</span>
            </div>
          </section>
        </div>

        <label class="ack">
          <input type="checkbox" id="ack" required />
          <span class="box"><svg viewBox="0 0 14 14"><path d="M2 7l3.5 3.5L12 3.5"/></svg></span>
          <span>I confirm the information above is accurate and agree to be contacted about my application.</span>
        </label>

        <button type="submit" class="submit" id="submitBtn">Submit application</button>
      </form>
    </div>
  </div>

  <script>
    // ── Roles → department gate + role-specific questions (from Career page.md) ──
    const ROLES = [
      { key:'content_editor', dept:'Content', label:'Content Editor', q:[
        'Link to 2–3 editing or writing samples (if any).',
        'Which topics are you most comfortable editing/fact-checking (e.g., Tech, Geopolitics, Business)?',
        'On a scale of 1–10, how would you rate your attention to detail regarding grammar and formatting?',
        'What is your process for verifying a fact before publishing?',
        'Are you comfortable using AI tools like Grammarly or Hemingway to refine content?' ] },
      { key:'content_writer_upsc', dept:'Content', label:'Content Writer', q:[
        'Link to a folder or blog of your previous writing (if any).',
        'Do you prefer writing long-form deep dives or short, catchy social media copy?',
        'How do you use AI tools (like ChatGPT) to improve your writing without losing your "human voice"?',
        'Can you turn around a 500-word article within 4 hours if a news story breaks?',
        'Which niche are you most passionate about writing for?' ] },
      { key:'graphic_designer_canva', dept:'Content', label:'Graphics Designer', q:[
        'Link to your Behance, Dribbble, or Drive portfolio (if any).',
        'Which software do you use for daily design work (Figma, Photoshop, Canva, etc.)?',
        'Briefly describe your design style (Minimalist, Bold, Corporate, etc.).',
        'How long does it usually take you to create a high-quality LinkedIn carousel?',
        'Are you comfortable following strict brand guidelines (colors, fonts)?' ] },
      { key:'uiux_designer', dept:'Content', label:'UI/UX Designer', q:[
        'Link to a UI/UX project or Figma prototype (if any).',
        'What is the first thing you consider when designing a landing page for a tech product?',
        'Are you proficient in Figma, Adobe XD, or Framer?',
        'Have you ever worked directly with developers to hand off designs?',
        'Do you have experience creating design systems (components, buttons, etc.)?' ] },
      { key:'video_editor_reels_yt', dept:'Media', label:'Video Editor', q:[
        'Link to your best edited video or a YouTube playlist (if any).',
        'Which software do you use (Premiere Pro, After Effects, CapCut Desktop, etc.)?',
        'How comfortable are you with sound design and background music leveling?',
        'Do you keep up with the latest transition trends on Reels/Shorts?',
        'What is your typical turnaround time for a 60-second edited reel?' ] },
      { key:'social_media_manager_ig', dept:'Media', label:'Social Media Management', q:[
        'Link to any social media page you have managed or grown (if any).',
        'Which platforms do you understand the algorithm for best (Instagram, X, LinkedIn)?',
        'Do you know how to read platform insights to improve reach?',
        'Write a 1-sentence "hook" to promote an AI internship on X (Twitter).',
        'How do you stay updated with daily social media trends?' ] },
      { key:'hr', dept:'Operations', label:'Human Resource (HR)', q:[
        'Do you have experience using LinkedIn, Discord, or Telegram for talent sourcing?',
        'How would you handle a situation where an intern is consistently missing deadlines?',
        'What is one thing you would do to keep a remote team of interns motivated?',
        'Are you comfortable conducting 15-minute initial screening calls?',
        'How do you manage and organize candidate data (Sheets, Notion, etc.)?' ] },
      { key:'marketing_outreach', dept:'Operations', label:'Marketing and Outreach', q:[
        'How would you approach a potential partner for a collaboration or event?',
        'Do you prefer "Cold DMing" on LinkedIn or "Cold Emailing"?',
        'Have you ever handled event promotions or campus ambassadorships (if any)?',
        'How do you track your leads or outreach messages?',
        'What is your strategy for getting people to register for an online webinar?' ] },
      { key:'management_coordination', dept:'Operations', label:'Management / Team Co-ordination', q:[
        'Which tools do you use to manage tasks (Notion, Trello, WhatsApp, etc.)?',
        'Describe a time you had to lead a group project or a small team.',
        'If a project is stuck because of a technical bug, what is your first step?',
        'Are you comfortable creating SOPs (Standard Operating Procedures) for other interns?',
        'How do you handle multiple projects with overlapping deadlines?' ] },
      { key:'tech_roles', dept:'Tech', label:'Tech Role (Developer)', hasSub:true, q:[
        'Link to your GitHub profile or hosted sites (if any).',
        'Which stack / languages are you most comfortable with?',
        'Can you build a pixel-perfect page from a Figma design, or design robust APIs?',
        'Describe a project you have built and deployed.' ] },
    ];
    const TECH_SUB = ['Frontend Developer','Backend Developer','Automation Engineer','Python Developer','Full Stack Developer'];

    // ── Reusable custom dropdown (accessible: click, keyboard, outside-close) ──
    function TVSelect(mount, cfg){
      const state = { value:'', open:false, active:-1, options:(cfg.options||[]).slice(), disabled:false };
      mount.classList.add('tvselect'); mount.innerHTML='';
      const btn = document.createElement('button');
      btn.type='button'; btn.className='tvselect-btn';
      btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
      const val = document.createElement('span'); val.className='tvselect-value placeholder'; val.textContent = cfg.placeholder||'Select…';
      const chev = document.createElement('span'); chev.className='tvselect-chev';
      chev.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      btn.append(val, chev);
      const panel = document.createElement('div'); panel.className='tvselect-panel'; panel.setAttribute('role','listbox');
      const hidden = document.createElement('input'); hidden.type='hidden';
      if (cfg.dataQ) hidden.setAttribute('data-q', cfg.dataQ);
      mount.append(btn, panel, hidden);

      const labelOf = () => { const o = state.options.find(o => o.value===state.value); return o ? o.label : ''; };
      function renderVal(){
        if (state.value){ val.textContent = labelOf(); val.classList.remove('placeholder'); }
        else { val.textContent = cfg.placeholder||'Select…'; val.classList.add('placeholder'); }
      }
      function renderOpts(){
        panel.innerHTML='';
        if (!state.options.length){ const e=document.createElement('div'); e.className='tvselect-empty'; e.textContent=cfg.emptyText||'No options'; panel.appendChild(e); return; }
        state.options.forEach((o,i) => {
          const el = document.createElement('div');
          el.className = 'tvselect-opt' + (o.value===state.value?' selected':'') + (i===state.active?' active':'');
          el.setAttribute('role','option'); el.setAttribute('aria-selected', o.value===state.value?'true':'false');
          el.innerHTML = '<span class="opt-main"><span class="opt-label"></span>' + (o.sub?'<span class="opt-sub"></span>':'') + '</span><span class="opt-check">✓</span>';
          el.querySelector('.opt-label').textContent = o.label;
          if (o.sub) el.querySelector('.opt-sub').textContent = o.sub;
          el.addEventListener('mousemove', () => { if (state.active!==i){ state.active=i; syncActive(); } });
          el.addEventListener('click', () => choose(i));
          panel.appendChild(el);
        });
      }
      function syncActive(){
        [...panel.children].forEach((c,i) => c.classList && c.classList.toggle('active', i===state.active));
        const a = panel.children[state.active]; if (a && a.scrollIntoView) a.scrollIntoView({ block:'nearest' });
      }
      function open(){
        if (state.disabled || state.open) return;
        state.open=true; mount.classList.add('open'); btn.setAttribute('aria-expanded','true');
        const sel = state.options.findIndex(o => o.value===state.value); state.active = sel<0?0:sel;
        renderOpts(); syncActive();
      }
      function close(){ if(!state.open) return; state.open=false; mount.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
      function choose(i){
        const o = state.options[i]; if(!o) return;
        state.value=o.value; hidden.value=o.value; renderVal(); close(); btn.focus();
        if (cfg.onChange) cfg.onChange(o.value);
      }
      btn.addEventListener('click', () => state.open ? close() : open());
      btn.addEventListener('keydown', (e) => {
        if (!state.open && (e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' ')){ e.preventDefault(); open(); return; }
        if (e.key==='Escape'){ close(); return; }
        if (!state.open) return;
        if (e.key==='ArrowDown'){ e.preventDefault(); state.active=Math.min(state.options.length-1,state.active+1); syncActive(); }
        else if (e.key==='ArrowUp'){ e.preventDefault(); state.active=Math.max(0,state.active-1); syncActive(); }
        else if (e.key==='Home'){ e.preventDefault(); state.active=0; syncActive(); }
        else if (e.key==='End'){ e.preventDefault(); state.active=state.options.length-1; syncActive(); }
        else if (e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(state.active); }
      });
      document.addEventListener('click', (e) => { if(!mount.contains(e.target)) close(); });

      renderVal();
      return {
        setOptions(opts){ state.options=(opts||[]).slice(); state.value=''; hidden.value=''; renderVal(); if(state.open) renderOpts(); },
        get value(){ return state.value; },
      };
    }

    // ── Role dropdown ──
    let current = null;
    const qHost = document.getElementById('roleQuestions');
    const roleSelect = TVSelect(document.getElementById('roleMount'), {
      placeholder:'Select a role…',
      emptyText:'No roles are open right now',
      onChange:(v) => { current = ROLES.find(r => r.key===v) || null; renderQuestions(current); },
    });
    function populateRoles(gates){
      // A role shows only if its own gate AND its category gate are open.
      const opts = ROLES
        .filter(r => gates ? (gates[r.key] !== false && gates[r.dept] !== false) : true)
        .map(r => ({ value:r.key, label:r.label, sub:r.dept }));
      roleSelect.setOptions(opts);
    }
    // Fetch which roles are open; if the API is unreachable, show all (server re-checks on submit).
    (async () => {
      try {
        const r = await fetch(`${window.TV_API_URL}?action=GET_PUBLIC_FORM_GATES`);
        const j = await r.json().catch(() => null);
        populateRoles(j && j.status === 'success' ? j.gates : null);
      } catch { populateRoles(null); }
    })();

    // ── Role-specific questions ──
    function renderQuestions(role){
      if (!role){ qHost.innerHTML = '<div class="role-empty">Pick a role above to see its questions.</div>'; return; }
      let html = '';
      if (role.hasSub){
        html += '<div class="field"><label>Developer specialisation <span class="req">*</span></label><div id="subMount"></div></div>';
      }
      role.q.forEach((q) => {
        const isLink = /link|url|github|portfolio|folder|blog/i.test(q);
        html += `<div class="field"><label>${q}</label>${isLink
          ? `<input data-q="${q.replace(/"/g,'&quot;')}" placeholder="https://…" />`
          : `<textarea data-q="${q.replace(/"/g,'&quot;')}" rows="2"></textarea>`}</div>`;
      });
      qHost.innerHTML = html;
      if (role.hasSub){
        TVSelect(document.getElementById('subMount'), {
          options: TECH_SUB.map(s => ({ value:s, label:s })),
          placeholder:'Select specialisation…',
          dataQ:'Specialisation',
        });
      }
    }

    // ── Resume file picker ──
    const resumeInput = document.getElementById('resumeInput');
    const fileName = document.getElementById('fileName');
    document.getElementById('fileBtn').addEventListener('click', () => resumeInput.click());
    resumeInput.addEventListener('change', () => {
      const f = resumeInput.files[0];
      if (f){ fileName.textContent = f.name; fileName.classList.add('has'); }
      else { fileName.textContent = 'No file chosen'; fileName.classList.remove('has'); }
    });

    // ── Submit ──
    const form = document.getElementById('applyForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const showMsg = (t, ok) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = t; window.scrollTo({ top: 0, behavior: 'smooth' }); };

    const readResume = () => new Promise((res) => {
      const f = resumeInput.files[0];
      if (!f) return res({ name:'', data:'' });
      const r = new FileReader();
      r.onload = () => res({ name: f.name, data: String(r.result).split(',')[1] || '' });
      r.onerror = () => res({ name:'', data:'' });
      r.readAsDataURL(f);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!current) return showMsg('Please select a role.', false);
      const fd = new FormData(form);
      const answers = {};
      qHost.querySelectorAll('[data-q]').forEach(el => { if (el.value.trim()) answers[el.getAttribute('data-q')] = el.value.trim(); });
      if (current.hasSub && !answers['Specialisation']) return showMsg('Please choose your developer specialisation.', false);
      if (!document.getElementById('ack').checked) return showMsg('Please confirm your details are accurate to continue.', false);

      const roleName = current.hasSub ? `${current.label} - ${answers['Specialisation'] || ''}` : current.label;

      btn.disabled = true; btn.textContent = 'Submitting…';
      const resume = await readResume();
      const payload = {
        action: 'CREATE',
        department: current.dept, roles: roleName,
        first_name: fd.get('first_name'), last_name: fd.get('last_name'),
        email: fd.get('email'), phone: fd.get('phone'), city: fd.get('city'),
        linkedin: fd.get('linkedin'), portfolio: fd.get('portfolio'), why_join: fd.get('why_join'),
        answers, resume_name: resume.name, resume_data: resume.data,
      };
      try {
        const r = await fetch(window.TV_API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
        const out = await r.json().catch(() => ({}));
        const status = out.status || (r.ok ? 'success' : 'error');
        if (status === 'success') {
          document.getElementById('formHost').innerHTML = `<div class="done"><img class="tick" src="emoji/1f389.png" alt="" width="66" height="66"><h2>Application received!</h2><p>Thanks for applying as <strong>${roleName}</strong>. We've noted your details and will be in touch by email, do check your inbox (and spam).</p></div>`;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (status === 'CLOSED') { showMsg('Applications for this role are currently closed. Please try another role or check back soon.', false); btn.disabled = false; btn.textContent = 'Submit application'; }
        else if (status === 'DUPLICATE_30D') { showMsg((out.cooldown && out.cooldown.message) || out.message || 'You have applied recently. Please try again later.', false); btn.disabled = false; btn.textContent = 'Submit application'; }
        else { showMsg('Something went wrong. Please try again.', false); btn.disabled = false; btn.textContent = 'Submit application'; }
      } catch (err) {
        showMsg('Network error - please check your connection and try again.', false);
        btn.disabled = false; btn.textContent = 'Submit application';
      }
    });
  </script>
</body>
</html>
