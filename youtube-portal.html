<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TIESVERSE | YouTube Application</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --card-bg: #111111;
                --border: #222222;
                --text: #ffffff;
                --text-dim: #888888;
                --accent: #FE7A00;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--bg);
                color: var(--text);
                font-family: "Inter", sans-serif;
                min-height: 100vh;
                position: relative;
                overflow-x: hidden;
            }

            #particles {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 1;
                pointer-events: none;
                opacity: 0.4;
            }

            /* ── HEADER ── */
            .header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 32px 24px;
                max-width: 900px;
                margin: 0 auto;
                position: relative;
                z-index: 10;
            }

            .logo {
                font-family: "Inter", sans-serif;
                font-size: 20px;
                font-weight: 800;
                color: var(--text);
                text-decoration: none;
            }
            .logo .dot { color: var(--accent); }
            .logo span { color: var(--accent); }
            .logo small {
                font-size: 9px;
                font-weight: 600;
                color: var(--text-dim);
                display: block;
                letter-spacing: 1px;
                margin-top: -2px;
            }

            .nav-links {
                display: flex;
                align-items: center;
                gap: 32px;
                list-style: none;
            }
            .nav-links a {
                color: var(--text);
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 1px;
                text-transform: uppercase;
                transition: color 0.2s;
            }
            .nav-links a:hover { color: var(--accent); }
            .nav-links .back-btn {
                border: 1px solid var(--border);
                color: var(--text-dim);
                padding: 8px 20px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 1px;
                border-radius: 4px;
            }
            .nav-links .back-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ── PAGE CONTENT & FORM CARD ── */
            .page-content {
                max-width: 760px;
                margin: 0 auto;
                padding: 20px 24px 80px;
                position: relative;
                z-index: 2;
            }

            .form-hero {
                text-align: center;
                margin-bottom: 40px;
            }
            .form-hero h1 {
                font-size: 28px;
                font-weight: 700;
                margin-bottom: 12px;
                letter-spacing: -0.02em;
            }
            .form-hero p {
                font-size: 14px;
                color: var(--text-dim);
            }

            .main-form-card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 48px;
                box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            }

            /* ── TYPOGRAPHY & LAYOUT ── */
            .section-title {
                font-size: 18px;
                font-weight: 700;
                color: var(--text);
                margin-top: 48px;
                margin-bottom: 24px;
                letter-spacing: -0.01em;
            }
            .section-title:first-child { margin-top: 0; }

            .grid-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .space-y > * + * { margin-top: 20px; }

            /* ── INPUTS ── */
            .field-label {
                font-size: 13px;
                font-weight: 500;
                color: var(--text);
                margin-bottom: 8px;
                display: block;
            }
            .field-label .req { color: #ff4444; }

            .form-input {
                width: 100%;
                background: #151515;
                border: 1px solid #333;
                border-radius: 6px;
                padding: 12px 14px;
                font-size: 14px;
                color: var(--text);
                outline: none;
                transition: all 0.2s;
                font-family: inherit;
            }
            .form-input:focus {
                border-color: var(--accent);
                background: #1a1a1a;
            }
            .form-input::placeholder { color: #555; }
            textarea.form-input { resize: vertical; min-height: 80px; }

            /* ── ROLE CHECKBOXES ── */
            .role-check {
                background: #151515;
                border: 1px solid #333;
                padding: 16px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                transition: border 0.2s;
            }
            .role-check:hover { border-color: var(--accent); }
            .role-check span { font-size: 14px; font-weight: 500; }

            /* ── UPLOAD BOX ── */
            .resume-upload-box {
                border: 1px dashed #444;
                border-radius: 8px;
                padding: 40px 24px;
                text-align: center;
                background: rgba(255, 255, 255, 0.01);
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                margin-top: 8px;
            }
            .resume-upload-box:hover {
                border-color: var(--accent);
                background: rgba(254, 122, 0, 0.03);
            }
            .resume-upload-box svg { width: 28px; height: 28px; color: var(--accent); }
            .resume-upload-title { font-size: 14px; font-weight: 600; color: var(--text); }
            .resume-upload-sub { font-size: 12px; color: var(--text-dim); }
            .resume-upload-btn {
                margin-top: 8px;
                padding: 8px 16px;
                border: 1px solid var(--accent);
                border-radius: 20px;
                color: var(--accent);
                font-size: 12px;
                font-weight: 600;
                background: transparent;
            }

            /* ── BUTTONS ── */
            .btn-submit {
                width: 100%;
                background: var(--accent);
                color: #fff;
                border: none;
                padding: 16px;
                font-size: 15px;
                font-weight: 600;
                border-radius: 8px;
                cursor: pointer;
                transition: opacity 0.2s;
                margin-top: 48px;
            }
            .btn-submit:hover { opacity: 0.9; }

            .ack-box {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                margin-top: 32px;
                padding: 16px;
                background: rgba(254, 122, 0, 0.05);
                border: 1px solid rgba(254, 122, 0, 0.2);
                border-radius: 8px;
                cursor: pointer;
            }
            .ack-box span { font-size: 13px; color: #ccc; line-height: 1.5; }

            .success-card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 60px 40px;
                text-align: center;
                box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            }
            .success-icon {
                width: 64px;
                height: 64px;
                background: rgba(254, 122, 0, 0.1);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 24px;
            }
            .success-icon svg { width: 32px; height: 32px; color: var(--accent); }
            .success-card h3 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
            .success-card p { font-size: 15px; color: var(--text-dim); margin-bottom: 32px; line-height: 1.6; }
            .whatsapp-btn {
                display: inline-block;
                background: #25D366;
                color: #fff;
                text-decoration: none;
                padding: 12px 24px;
                border-radius: 24px;
                font-size: 14px;
                font-weight: 600;
                transition: background 0.2s;
            }
            .whatsapp-btn:hover { background: #1ebe57; }
            .back-link {
                background: transparent;
                border: none;
                color: var(--text-dim);
                font-size: 13px;
                cursor: pointer;
            }
            .back-link:hover { color: var(--text); }

            @media (max-width: 768px) {
                .main-form-card { padding: 32px 20px; }
                .grid-2 { grid-template-columns: 1fr; }
            }
        </style>
    </head>

            let fieldStore = [];
            function renderQuestions() {
                const c = document.getElementById("dynamic-questions");
                if (!c) return;
                c.innerHTML = "";
                fieldStore = [];
                let qi = 0;
                document
                    .querySelectorAll(".role-checkbox:checked")
                    .forEach((cb) => {
                        const role = cb.value;
                        const qs = ROLE_QUESTIONS[role] || [];
                        const w = document.createElement("div");
                        w.className = "form-block space-y";
                        w.innerHTML = `<div class="form-block-title">04 // ${role} — Questions</div>`;
                        qs.forEach((q) => {
                            const id = "yt_q_" + qi++;
                            fieldStore.push({
                                id,
                                role,
                                label: q.q,
                                req: q.req,
                            });
                            const star = q.req
                                ? '<span class="req">*</span>'
                                : "";
                            const d = document.createElement("div");
                            d.innerHTML = `<label class="field-label">${q.q} ${star}</label><input type="text" id="${id}" class="form-input" ${q.req ? "required" : ""}>`;
                            w.appendChild(d);
                        });
                        c.appendChild(w);
                    });
            }

            async function getResumeData() {
                const input = document.getElementById("resume");
                if (!input || !input.files.length)
                    return { resume_name: "", resume_data: "" };
                const file = input.files[0];
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) =>
                        resolve({
                            resume_name: file.name,
                            resume_data: e.target.result,
                        });
                    reader.onerror = () =>
                        resolve({ resume_name: file.name, resume_data: "" });
                    reader.readAsDataURL(file);
                });
            }

            function updateKulaResume() {
                const input = document.getElementById("resume");
                const title = document.getElementById("resumeTitle");
                if (input.files.length > 0) {
                    title.textContent = "Uploaded: " + input.files[0].name;
                    title.style.color = "var(--accent)";
                } else {
                    title.textContent = "Upload your file or drag and drop here";
                    title.style.color = "";
                }
            }
            async function deploy() {
    // 1. Validation Checks
    if (selectedTracks.length === 0) return alert("Please select at least one creative track.");

    const req = ["content_name", "content_mail", "content_phone", "content_city", "content_linkedin", "why_join_content"];
    for (let id of req) { 
        if (!document.getElementById(id).value) return alert("System Error: Missing mandatory fields."); 
    }
    if (!document.getElementById("acknowledge").checked) return alert("System Error: Must acknowledge terms.");

    for (let f of roleFieldStore) {
        if (f.req && !document.getElementById(f.id).value) {
            return alert(`System Error: Missing answer for ${f.role} -> ${f.label}`);
        }
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "pushing_to_cloud...";
    btn.disabled = true;

    // 2. Format Answers for the Unified Backend
    const roleAnswers = [];
    roleFieldStore.forEach((f) => {
        roleAnswers.push({
            q: `[${f.role}] ${f.label}`,
            a: document.getElementById(f.id).value,
        });
    });

    // 3. Handle Optional Resume
    const { resume_name, resume_data } = await getResumeData();

    // 4. Build Unified Payload
    const payload = {
        action: "CREATE",
        department: "Content", // Explicitly tags it for your master sheet
        roles: document.getElementById("roleInput").value,
        first_name: document.getElementById("content_name").value,
        last_name: document.getElementById("content_last").value,
        email: document.getElementById("content_mail").value,
        phone: document.getElementById("content_phone").value,
        city: document.getElementById("content_city").value,
        linkedin: document.getElementById("content_linkedin").value,
        portfolio: document.getElementById("content_portfolio").value,
        why_join: document.getElementById("why_join_content").value,
        answers: roleAnswers,
        resume_name: resume_name,
        resume_data: resume_data
    };

    // 5. Send to Google Sheets
    try {
        await fetch(SHEET_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload),
            headers: { "Content-Type": "application/json" }
        });
        document.getElementById("form-content").style.display = "none";
        document.getElementById("success-msg").style.display = "block";
        window.scrollTo(0, 0);
    } catch (e) {
        alert("Network Error: Failed to reach deployment server.");
        btn.innerText = "Apply for this position";

            /* Particles */
            const canvas = document.getElementById("particles"),
                ctx = canvas.getContext("2d");
            let particles = [];
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = Math.max(
                    document.body.scrollHeight,
                    window.innerHeight,
                );
            }
            function createParticles() {
                particles = [];
                const c = Math.floor((canvas.width * canvas.height) / 18000);
                for (let i = 0; i < c; i++)
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1 + 0.3,
                        a: Math.random() * 0.4 + 0.1,
                        dx: (Math.random() - 0.5) * 0.12,
                        dy: (Math.random() - 0.5) * 0.12,
                        ph: Math.random() * Math.PI * 2,
                    });
            }
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const t = Date.now() * 0.001;
                particles.forEach((p) => {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.a * (0.6 + 0.4 * Math.sin(t + p.ph))})`;
                    ctx.fill();
                });
                requestAnimationFrame(drawParticles);
            }
            window.addEventListener("resize", () => {
                resizeCanvas();
                createParticles();
            });
            resizeCanvas();
            createParticles();
            drawParticles();
        </script>

            const lenis = new Lenis();

                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);
