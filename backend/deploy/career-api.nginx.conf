# nginx server block for api.career.tiesverse.com
# Place at /etc/nginx/sites-available/career-api  and symlink into sites-enabled.
# HTTPS is added by certbot (it rewrites this file). See DEPLOY.md.

server {
    listen 80;
    server_name api.career.tiesverse.com;

    # Resume downloads / any uploaded media served by Django are proxied too.
    client_max_body_size 25M;   # allow CV/resume uploads through

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
